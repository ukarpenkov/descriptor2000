name: Desktop builds
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Check packaged Windows runtime
        if: runner.os == 'Windows'
        run: npx electron scripts/smoke-desktop.cjs
        env:
          DESCRIPTOR_APP: release/win-unpacked/resources/app.asar
      - uses: actions/upload-artifact@v4
        with:
          name: descriptor2000-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.exe
