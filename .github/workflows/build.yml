name: Desktop builds
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            installer: Descriptor2000-mac.dmg
          - os: windows-latest
            installer: Descriptor2000-windows.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Launch isolated packaged application
        run: npm run test:packaged
      - uses: actions/upload-artifact@v4
        with:
          name: descriptor2000-${{ matrix.os }}
          path: release/${{ matrix.installer }}
          if-no-files-found: error
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: descriptor2000-*
          path: installers
          merge-multiple: true
      - name: Publish latest installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          test -f installers/Descriptor2000-windows.exe
          test -f installers/Descriptor2000-mac.dmg
          version=$(node -p "require('./package.json').version")
          short=$(printf '%s' "$GITHUB_SHA" | cut -c1-7)
          tag="v${version}-${short}"
          gh release create "$tag" \
            installers/Descriptor2000-windows.exe \
            installers/Descriptor2000-mac.dmg \
            --title "Descriptor2000 ${version}" \
            --notes "Сборка ${short} ветки main. Версия ${version}." \
            --latest
